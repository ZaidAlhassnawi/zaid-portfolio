<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Reset Password | Zaid Portfolio</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="admin-brand" href="../index.html"><span>ZH</span> Portfolio</a>

      <section id="request-section">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1>Reset password</h1>
        <p class="muted">Enter the email address of the existing administrator account.</p>
        <form id="request-form">
          <label>Email<input id="recovery-email" type="email" autocomplete="email" required /></label>
          <button class="primary-button" type="submit">Send recovery link</button>
        </form>
      </section>

      <section id="update-section" hidden>
        <p class="eyebrow">CHOOSE A NEW PASSWORD</p>
        <h1>Set new password</h1>
        <p class="muted">Use at least 12 characters and do not reuse your Supabase or database password.</p>
        <form id="update-form">
          <label>New password<input id="new-password" type="password" autocomplete="new-password" minlength="12" required /></label>
          <label>Confirm password<input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required /></label>
          <button class="primary-button" type="submit">Update password</button>
        </form>
      </section>

      <div class="notice error" id="configuration-error" hidden></div>
      <p class="form-message" id="recovery-message" role="status"></p>
      <a class="back-link" href="login.html">← Return to sign in</a>
    </main>
    <script type="module" src="../assets/js/reset-password.js"></script>
  </body>
</html>
